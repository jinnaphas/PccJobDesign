<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Evaluation — PCC People</title>
<link rel="stylesheet" href="shared.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
  .seg{display:inline-flex;border:1.5px solid var(--border);border-radius:8px;overflow:hidden}
  .seg button{border:0;background:#fff;padding:7px 13px;font-size:12.5px}.seg button.on{background:var(--blue);color:#fff}.seg button:disabled{color:#aab;cursor:not-allowed}
  .jd{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:12px 15px;margin:12px 0;font-size:13px}.jd b{color:var(--navy)}
  .kpis{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
  .k{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:10px 16px;flex:1;min-width:104px}
  .k .n{font-size:22px;font-weight:800}.k .l{font-size:11px;color:var(--muted)}
  .k.good .n{color:var(--ok)}.k.mid .n{color:var(--warn)}.k.bad .n{color:var(--crit)}
  td .sel{margin-right:6px}
  .wbox{font-size:12px;color:var(--muted);background:#fff;border:1.5px solid var(--border);border-radius:9px;padding:9px 12px;margin-bottom:12px}
  .wbox b{color:var(--text)}
  .li{font-size:12px;margin-left:16px;margin-bottom:3px}
  /* --- filter bar --- */
  .fbar{background:#fff;border:1.5px solid var(--border);border-radius:10px;padding:11px 13px;margin-bottom:12px;display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end}
  .fld{display:flex;flex-direction:column;gap:3px}
  .fld label{font-size:10.5px;color:var(--muted);font-weight:700;letter-spacing:.03em;text-transform:uppercase}
  .fld select,.fld input{font:inherit;font-size:12.5px;padding:6px 9px;border:1.5px solid var(--border);border-radius:8px;background:#fff;min-width:150px}
  .fbar .spacer{flex:1}
  .fcount{font-size:12px;color:var(--muted)}
  .fcount b{color:var(--navy)}
  /* --- log panel --- */
  .logp{background:#fff;border:1.5px solid var(--border);border-radius:10px;margin-bottom:12px;overflow:hidden}
  .logh{display:flex;align-items:center;gap:8px;padding:10px 13px;cursor:pointer;font-size:13px;font-weight:700;color:var(--navy);user-select:none}
  .logh .ar{margin-left:auto;color:var(--muted);font-weight:400;font-size:11.5px}
  .logb{border-top:1.5px solid var(--border);padding:4px 0}
  .logrow{display:flex;gap:10px;align-items:center;padding:8px 13px;font-size:12.5px;border-bottom:1px solid #eef1f6;flex-wrap:wrap}
  .logrow:last-child{border-bottom:0}
  .logrow .dt{font-weight:700;color:var(--navy);min-width:88px;font-variant-numeric:tabular-nums}
  .logrow .lb{flex:1;min-width:160px}
  .logrow .ct{color:var(--muted);font-size:11.5px}
  /* --- table extras --- */
  th.sortable{cursor:pointer;white-space:nowrap}
  th.sortable:hover{color:var(--blue)}
  th .si{font-size:9px;opacity:.6;margin-left:2px}
  .namebtn{background:none;border:0;padding:0;font:inherit;font-weight:700;color:var(--navy);cursor:pointer;text-align:left}
  .namebtn:hover{text-decoration:underline}
  .bdg{display:inline-block;font-size:10px;padding:2px 7px;border-radius:20px;background:#eef3fa;color:#41618f;font-variant-numeric:tabular-nums;white-space:nowrap}
  .dims{display:flex;gap:2px;align-items:flex-end;height:20px}
  .dims i{display:block;width:7px;border-radius:2px 2px 0 0;background:#9fb3cc}
  .dims i.hi{background:var(--ok)}.dims i.lo{background:var(--crit)}
  .tw{overflow-x:auto}
  @media (max-width:760px){ .fld select,.fld input{min-width:130px} }
</style>
</head>
<body>
<div id="nav"></div>
<div class="wrap">
  <div class="row no-print">
    <div class="seg"><button class="on">Hiring</button><button disabled title="Phase 3 — needs employee data">Gap Closing</button><button disabled title="Phase 3 — needs employee data">Promotion</button></div>
    <span class="spacer"></span>
    <button class="btn sm" id="cmpbtn" onclick="compare()">⚖️ <span id="t-cmp"></span></button>
    <button class="btn sm" onclick="exportCSV()">⬇️ <span id="t-exp"></span></button>
  </div>
  <div class="jd" id="jd"></div>

  <div class="fbar no-print" id="fbar">
    <div class="fld"><label id="lb-role">ตำแหน่ง</label><select id="role"></select></div>
    <div class="fld"><label id="lb-batch">รอบการวิเคราะห์</label><select id="batch"></select></div>
    <div class="fld"><label id="lb-period">ช่วงเวลา</label><select id="period"></select></div>
    <div class="fld"><label id="lb-search">ค้นหา</label><input type="search" id="q" placeholder="ชื่อ / ตำแหน่ง / บริษัท"></div>
    <span class="spacer"></span>
    <div class="fld"><span class="fcount" id="fcount"></span>
      <button class="btn sm" id="clearf" onclick="clearFilters()">ล้างตัวกรอง</button></div>
  </div>

  <div class="logp no-print" id="logp" hidden>
    <div class="logh" id="logh" role="button" tabindex="0">📋 <span id="t-log">ประวัติรอบวิเคราะห์ (Log)</span><span class="ar" id="logar">▼ แสดง</span></div>
    <div class="logb" id="logb" hidden></div>
  </div>

  <div class="wbox" id="wbox"></div>
  <div class="row no-print" id="recfilter" style="margin-bottom:10px"></div>
  <div class="kpis" id="kpis"></div>
  <div class="tw" id="tablewrap"></div>
</div>
<div class="ov" id="ov" onclick="if(event.target===this)this.classList.remove('show')"><div class="mod" id="mod"></div></div>
<footer>PCC Group · Evaluation (Hiring)</footer>
<script src="shared.js"></script>
<script>
let REF,ROLES,MODEL,IDX=[],PEOPLE=[],BATCHES=[],KR={},TARGET='PCC-HR-HCDM-L3',recF=new Set(),sortK='overall',sortD=-1;
const DIMS=['education','experience','skills','english','digital','certifications'];
const $=id=>document.getElementById(id);
const th=()=>PCC.lang()==='th';
const col=p=>p>=75?'#1a7f5a':p>=60?'#b87c00':'#c0392b';

async function boot(){
  PCC.nav('evaluate');
  $('t-cmp').textContent=th()?'เทียบที่เลือก':'Compare';$('t-exp').textContent=PCC.t('exportcsv');
  if(!th()){$('lb-role').textContent='Role';$('lb-batch').textContent='Analysis batch';$('lb-period').textContent='Period';
    $('lb-search').textContent='Search';$('clearf').textContent='Clear filters';$('t-log').textContent='Analysis log';}
  try{REF=await PCC.ref();ROLES=(await (await fetch('../data/job_roles.json')).json()).roles;MODEL=await (await fetch('../data/scoring_model.json')).json();}
  catch(e){$('tablewrap').innerHTML=PCC.needLiveMsg();return;}
  try{IDX=(await (await fetch('../data/people/index.json?v='+Date.now(),{cache:'no-store'})).json()).datasets||[];}catch(e){IDX=[];}

  // newest analysis round first, so a freshly synced batch is what opens
  IDX.sort((a,b)=>(b.latest||'').localeCompare(a.latest||''));
  const want=PCC.qs('target');
  if(want)TARGET=want; else if(IDX.length)TARGET=IDX[0].code;
  if(!IDX.some(d=>d.code===TARGET)&&IDX.length)TARGET=IDX[0].code;
  IDX.forEach(d=>{const o=document.createElement('option');o.value=d.code;
    o.textContent=`${(th()&&d.title_th)||d.title_en} (${d.code}) · ${d.count} คน${d.latest?' · '+d.latest:''}`;
    $('role').appendChild(o);});
  if(!IDX.length){const o=document.createElement('option');o.value=TARGET;o.textContent=TARGET;$('role').appendChild(o);}
  $('role').value=TARGET;$('role').onchange=()=>{TARGET=$('role').value;load();};

  const w=MODEL.modes.hiring.weights;
  $('wbox').innerHTML=(th()?'น้ำหนักเกณฑ์ (Hiring): ':'Scoring weights (Hiring): ')+DIMS.map(d=>`${d} <b>${w[d]||0}%</b>`).join(' · ')+` &nbsp; | เกณฑ์: Proceed ≥${MODEL.modes.hiring.thresholds.high} · Consider ≥${MODEL.modes.hiring.thresholds.mid}`;

  ['Proceed','Consider','Not Suitable'].forEach(rc=>{const c=document.createElement('span');c.className='chip';c.textContent=rc;
    c.onclick=()=>{recF.has(rc)?recF.delete(rc):recF.add(rc);c.classList.toggle('on');render();};$('recfilter').appendChild(c);});

  $('period').innerHTML=`<option value="">${th()?'ทั้งหมด':'All time'}</option>
    <option value="30">${th()?'30 วันล่าสุด':'Last 30 days'}</option>
    <option value="90">${th()?'90 วันล่าสุด':'Last 90 days'}</option>
    <option value="365">${th()?'12 เดือนล่าสุด':'Last 12 months'}</option>`;
  ['batch','period','q'].forEach(id=>$(id).addEventListener('input',render));
  $('logh').onclick=toggleLog;
  $('logh').onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggleLog();}};
  load();
}
function toggleLog(){const b=$('logb');b.hidden=!b.hidden;$('logar').textContent=(b.hidden?'▼ ':'▲ ')+(b.hidden?(th()?'แสดง':'show'):(th()?'ซ่อน':'hide'));}

async function load(){
  try{const pf=await (await fetch('../data/people/candidates_'+TARGET+'.json?v='+Date.now(),{cache:'no-store'})).json();
    PEOPLE=pf.people||[];KR=pf._meta.kr_keys||{};BATCHES=(pf._meta.batches||[]).slice().sort((a,b)=>(b.date||'').localeCompare(a.date||''));}
  catch(e){PEOPLE=[];KR={};BATCHES=[];}
  // batch picker — default to the newest round so old and new analyses never mix
  const latest=BATCHES[0];
  $('batch').innerHTML=(latest?`<option value="__latest">${th()?'รอบล่าสุด':'Latest round'} · ${latest.date} (${latest.count} ${th()?'คน':'people'})</option>`:'')
    +`<option value="">${th()?'ทุกรอบ (รวมประวัติเก่า)':'All rounds (incl. history)'}</option>`
    +BATCHES.map(b=>`<option value="${PCC.esc(b.id)}">${PCC.esc(b.date||'')} · ${PCC.esc(b.label||b.id)} (${b.count||0})</option>`).join('');
  $('batch').value=latest?'__latest':'';
  renderLog(); render();
}
function renderLog(){
  if(!BATCHES.length){$('logp').hidden=true;return;}
  $('logp').hidden=false;
  $('logb').innerHTML=BATCHES.map(b=>`<div class="logrow">
    <span class="dt">${PCC.esc(b.date||'—')}</span>
    <span class="lb">${PCC.esc(b.label||b.id)}<div class="ct">${PCC.esc(b.source||'')}${b.method?' · '+PCC.esc(b.method):''}</div></span>
    <span class="bdg">${b.count||0} ${th()?'คน':'people'}</span>
    <button class="btn sm" onclick="pickBatch('${PCC.esc(b.id)}')">${th()?'ดูเฉพาะรอบนี้':'View this round'}</button></div>`).join('');
}
function pickBatch(id){$('batch').value=id;render();window.scrollTo({top:0,behavior:'smooth'});}
function clearFilters(){recF.clear();$('recfilter').querySelectorAll('.chip').forEach(c=>c.classList.remove('on'));
  $('q').value='';$('period').value='';$('batch').value=BATCHES.length?'__latest':'';render();}

function activeBatchIds(){
  const v=$('batch').value;
  if(v==='__latest')return BATCHES.length?new Set([BATCHES[0].id]):null;
  if(v)return new Set([v]);
  return null; // all
}
function filtered(){
  const bset=activeBatchIds(), days=+$('period').value||0, q=$('q').value.trim().toLowerCase();
  const cutoff=days?new Date(Date.now()-days*864e5).toISOString().slice(0,10):null;
  return PEOPLE.filter(p=>{
    const e=p.evaluation||{};
    if(bset&&!bset.has(e.batch_id))return false;
    if(cutoff&&(e.analyzed_at||'')<cutoff)return false;
    if(recF.size&&!recF.has(e.recommendation))return false;
    if(q){const hay=(p.name+' '+(p.current_title||'')+' '+(p.current_company||'')).toLowerCase();if(!hay.includes(q))return false;}
    return true;
  });
}
const SORTS={name:p=>p.name||'',exp:p=>p.experience?.total_years||0,overall:p=>p.evaluation?.overall_pct||0,
  rec:p=>({'Proceed':3,'Consider':2,'Not Suitable':1}[p.evaluation?.recommendation]||0),date:p=>p.evaluation?.analyzed_at||''};
function sortBy(k){ if(sortK===k)sortD=-sortD; else {sortK=k;sortD=(k==='name')?1:-1;} render(); }

function render(){
  const r=ROLES.find(x=>x.code===TARGET)||{};
  $('jd').innerHTML=`🎯 <b>${PCC.title(r)||TARGET}</b> · <span class="mono">${TARGET}</span> · ${r.level||''} · JE ${r.je_score??'—'}`+(r.purpose_th?`<br><span class="muted">${PCC.esc(r.purpose_th)}</span>`:'');
  if(!PEOPLE.length){$('kpis').innerHTML='';$('wbox').classList.add('hide');$('recfilter').classList.add('hide');$('fcount').textContent='';
    $('tablewrap').innerHTML=`<div class="msg">${th()?'ยังไม่มีข้อมูลผู้สมัครสำหรับตำแหน่งนี้':'No candidate data for this role yet'} · <a href="evaluate.html?target=PCC-HR-HCDM-L3">ดูตัวอย่าง HCDM-L3</a></div>`;return;}
  $('wbox').classList.remove('hide');$('recfilter').classList.remove('hide');

  const list=filtered().slice().sort((a,b)=>{const f=SORTS[sortK];const x=f(a),y=f(b);
    return (typeof x==='string'?x.localeCompare(y):x-y)*sortD;});
  $('fcount').innerHTML=th()?`แสดง <b>${list.length}</b> จาก ${PEOPLE.length} คน`:`Showing <b>${list.length}</b> of ${PEOPLE.length}`;

  const cnt={Proceed:0,Consider:0,'Not Suitable':0};list.forEach(p=>cnt[p.evaluation.recommendation]=(cnt[p.evaluation.recommendation]||0)+1);
  const avg=list.length?Math.round(list.reduce((a,p)=>a+(p.evaluation.overall_pct||0),0)/list.length):0;
  $('kpis').innerHTML=`<div class="k"><div class="n">${list.length}</div><div class="l">${th()?'ผู้สมัคร (ที่กรอง)':'candidates (filtered)'}</div></div>
    <div class="k good"><div class="n">${cnt.Proceed}</div><div class="l">Proceed</div></div>
    <div class="k mid"><div class="n">${cnt.Consider}</div><div class="l">Consider</div></div>
    <div class="k bad"><div class="n">${cnt['Not Suitable']}</div><div class="l">Not Suitable</div></div>
    <div class="k"><div class="n">${avg}%</div><div class="l">${th()?'ค่าเฉลี่ยความเหมาะสม':'average fit'}</div></div>`;

  const si=k=>sortK===k?`<span class="si">${sortD>0?'▲':'▼'}</span>`:'';
  let h=`<table><thead><tr><th></th><th>#</th>
    <th class="sortable" onclick="sortBy('name')">${th()?'ชื่อ':'Name'}${si('name')}</th>
    <th>${th()?'ตำแหน่งปัจจุบัน':'Current'}</th>
    <th class="sortable" onclick="sortBy('exp')">Exp${si('exp')}</th>
    <th>${th()?'6 มิติ':'6 dims'}</th>
    <th class="sortable" onclick="sortBy('overall')">Overall${si('overall')}</th>
    <th class="sortable" onclick="sortBy('rec')">${th()?'ผล':'Result'}${si('rec')}</th>
    <th class="sortable" onclick="sortBy('date')">${th()?'รอบ':'Round'}${si('date')}</th></tr></thead><tbody>`;
  list.forEach((p,i)=>{const e=p.evaluation;
    const bars=DIMS.map(d=>{const v=e.scores?.[d]||0;
      return `<i style="height:${Math.max(3,Math.round(v/100*20))}px" class="${v>=75?'hi':v<50?'lo':''}" title="${d}: ${v}"></i>`}).join('');
    h+=`<tr><td><input type="checkbox" class="sel" data-id="${p.id}" onchange="syncCmp()"></td><td>${i+1}</td>
    <td><button class="namebtn" onclick="openP('${p.id}')">${PCC.esc(p.name)}</button></td>
    <td>${PCC.esc(p.current_title||'')}<br><span class="muted" style="font-size:11px">${PCC.esc(p.current_company||'')}</span></td>
    <td>${p.experience?.total_years||''}</td>
    <td><div class="dims">${bars}</div></td>
    <td><div class="row" style="gap:6px"><div class="bar" style="width:64px"><i style="width:${e.overall_pct}%;background:${col(e.overall_pct)}"></i></div><b>${e.overall_pct}%</b></div></td>
    <td><span class="pill ${PCC.recClass(e.recommendation)}">${e.recommendation}</span></td>
    <td><span class="bdg">${PCC.esc(e.analyzed_at||'—')}</span></td></tr>`;});
  h+='</tbody></table>';
  $('tablewrap').innerHTML=list.length?h:`<div class="msg">${th()?'ไม่มีผู้สมัครตรงตัวกรอง — ลองกด "ล้างตัวกรอง"':'No candidates match the filters — try “Clear filters”'}</div>`;
  syncCmp();
}
function syncCmp(){const n=document.querySelectorAll('.sel:checked').length;
  $('cmpbtn').disabled=n<2;$('t-cmp').textContent=(th()?'เทียบที่เลือก':'Compare')+(n?` (${n})`:'');}

function radarCfg(datasets,labels){return{type:'radar',data:{labels,datasets},options:{scales:{r:{min:0,max:100,ticks:{stepSize:25,font:{size:9}},pointLabels:{font:{size:10}}}},plugins:{legend:{labels:{boxWidth:10,font:{size:11}}}}}};}
function openP(id){
  const p=PEOPLE.find(x=>x.id===id),e=p.evaluation;
  const bl=(BATCHES.find(b=>b.id===e.batch_id)||{}).label||'';
  let h=`<div class="mh" style="background:var(--navy)"><button class="close" onclick="$('ov').classList.remove('show')">×</button>
    <h2>${PCC.esc(p.name)}</h2><div style="opacity:.9;font-size:12.5px">${PCC.esc(p.current_title||'')} @ ${PCC.esc(p.current_company||'')} · ${p.education?.level||''} · ${p.experience?.total_years||''} ปี · EN ${p.languages?.english||''}</div>
    <div style="margin-top:8px"><span class="pill ${PCC.recClass(e.recommendation)}">${e.recommendation} · ${e.overall_pct}%</span>
    ${e.analyzed_at?`<span class="bdg" style="margin-left:6px">${th()?'วิเคราะห์':'analyzed'} ${PCC.esc(e.analyzed_at)}${bl?' · '+PCC.esc(bl):''}</span>`:''}</div></div><div class="mb">
    <div class="row" style="gap:14px;align-items:flex-start"><div style="flex:1;min-width:220px"><canvas id="rad1" height="220"></canvas></div><div style="flex:1;min-width:220px"><canvas id="rad2" height="220"></canvas></div></div>`;
  const sec=(t,arr,ic)=>{if(!arr?.length)return'';let s=`<h3>${t}</h3>`;arr.forEach(x=>s+=`<div class="li">${ic} ${PCC.esc(x)}</div>`);return s;};
  h+=sec(th()?'จุดแข็ง':'Strengths',e.key_strengths,'✅');
  h+=sec(th()?'ช่องว่าง':'Gaps',e.key_gaps,'⚠️');
  h+=sec(th()?'หลักฐานอ้างอิง':'Evidence',e.evidence,'📎');
  h+=sec(th()?'ข้อสังเกต / ความเสี่ยง':'Risk flags',e.risk_flags,'🚩');
  h+=sec(th()?'ประเด็นสัมภาษณ์':'Interview focus',e.interview_focus,'❓');
  h+='</div>';$('mod').innerHTML=h;$('ov').classList.add('show');
  if(typeof Chart==='undefined')return;
  new Chart($('rad1'),radarCfg([{label:th()?'คะแนน 6 มิติ':'6 dimensions',data:DIMS.map(d=>e.scores[d]||0),fill:true,backgroundColor:'rgba(46,95,158,.2)',borderColor:'#2E5F9E'}],DIMS));
  const kk=Object.keys(e.kr_alignment||{});
  if(kk.length)new Chart($('rad2'),radarCfg([{label:'KR Alignment',data:kk.map(k=>e.kr_alignment[k]),fill:true,backgroundColor:'rgba(16,127,90,.2)',borderColor:'#1a7f5a'}],kk.map(k=>KR[k]||k)));
}
function compare(){
  const ids=[...document.querySelectorAll('.sel:checked')].map(c=>c.dataset.id).slice(0,3);
  if(ids.length<2){alert(th()?'เลือกผู้สมัคร 2-3 คนเพื่อเทียบ':'Select 2-3 candidates to compare');return;}
  const cols=['#2E5F9E','#c0392b','#1a7f5a'];
  const ds=ids.map((id,i)=>{const p=PEOPLE.find(x=>x.id===id),e=p.evaluation;
    return{label:p.name,data:DIMS.map(d=>e.scores[d]||0),fill:true,backgroundColor:cols[i]+'22',borderColor:cols[i]};});
  $('mod').innerHTML=`<div class="mh" style="background:var(--navy)"><button class="close" onclick="$('ov').classList.remove('show')">×</button><h2>${th()?'เทียบผู้สมัคร':'Compare candidates'}</h2></div><div class="mb"><canvas id="radc" height="260"></canvas><div id="ctab" style="margin-top:12px"></div></div>`;
  $('ov').classList.add('show');
  if(typeof Chart!=='undefined')new Chart($('radc'),radarCfg(ds,DIMS));
  let t='<table><thead><tr><th>'+(th()?'ชื่อ':'Name')+'</th><th>Overall</th>'+DIMS.map(d=>`<th>${d}</th>`).join('')+'<th>'+(th()?'รอบ':'Round')+'</th></tr></thead><tbody>';
  ids.forEach(id=>{const p=PEOPLE.find(x=>x.id===id),e=p.evaluation;
    t+=`<tr><td><b>${PCC.esc(p.name)}</b></td><td>${e.overall_pct}%</td>`+DIMS.map(d=>`<td>${e.scores[d]||0}</td>`).join('')+`<td>${PCC.esc(e.analyzed_at||'—')}</td></tr>`;});
  $('ctab').innerHTML=t+'</tbody></table>';
}
function exportCSV(){
  const list=filtered();
  if(!list.length){alert(th()?'ไม่มีข้อมูลตามตัวกรองปัจจุบัน':'Nothing matches the current filters');return;}
  const krk=Object.keys(list[0]?.evaluation.kr_alignment||{});
  const rows=[['Name','Current Title','Company','Total Exp','Overall %','Recommendation','Analyzed At','Batch',...DIMS,...krk]];
  list.forEach(p=>{const e=p.evaluation;rows.push([p.name,p.current_title,p.current_company,p.experience?.total_years,
    e.overall_pct,e.recommendation,e.analyzed_at||'',e.batch_id||'',...DIMS.map(d=>e.scores[d]),...krk.map(k=>e.kr_alignment[k])]);});
  PCC.exportCSV('candidates_'+TARGET+'_'+($('batch').value||'all')+'.csv',rows);
}
boot();
</script>
